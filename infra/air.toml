root = "/src/api"
tmp_dir = "bin"
env_files = []

[build]
cmd = "go build -o ./bin/mtg4fun ./cmd/mtg4fun"
entrypoint = ["/usr/local/bin/mtg4fun-dev"]
include_ext = ["go", "sql", "xml"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["bin", "data", "tests"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "10s"
rerun = false
rerun_delay = 1000

[log]
time = true

[misc]
clean_on_exit = false
